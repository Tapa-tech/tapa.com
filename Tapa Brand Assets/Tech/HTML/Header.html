<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Header System — The Tapa Co.</title>
<style>
/* ============================================================
   THE TAPA CO. — HEADER SYSTEM
   Main menu · four category dropdowns · mobile drawer ·
   search overlay · account menu · mini-cart · scrolled state
   ============================================================ */
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --darkbar:#1A1208;
  --pink:#FD066D; --amber:#E8A020; --gold:#A07800; --yellow:#EDAB3A;
  --body-text:#2C2010; --mid-text:#5C4B12; --sub-text:#8A7A68;
  --border:#E8E0D0; --border-light:#F0E8D8;
  --hero-text:#FFFDF5; --dim:#7A6A55;
  --d-bg:#E6F1E6; --d-tx:#27500A; --d-bd:#C9DFC9;
  --p-bg:#FFF8E6; --p-tx:#A07800; --p-bd:#EFE0B8;
  --b-bg:#F0E9E1; --b-tx:#4A3525; --b-bd:#D9CBB8;
  --data-bg:#EEF3F7; --data-tx:#1F4460; --data-bd:#C3D6E4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--body-text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}

/* ── PREVIEW STRIP ── */
.pv{background:#2E2260;padding:10px 32px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:200}
.pv-l{font-size:9.5px;font-weight:700;color:#B9A9DC;letter-spacing:.7px;margin-right:4px}
.pvb{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:600;color:#D8CEF0}
.pvb.on{background:#fff;color:#2E2260;border-color:#fff}
.pv-n{margin-left:auto;font-size:10.5px;color:#9A8AC0;font-style:italic}

.stage{padding:34px 32px 90px;max-width:1400px;margin:0 auto}
.lbl{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.8px;margin:32px 0 10px}
.lbl:first-child{margin-top:0}
.note{font-size:13px;color:var(--sub-text);line-height:1.75;margin:0 0 14px;max-width:760px}
.frame{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:visible;box-shadow:0 2px 18px rgba(28,23,18,.05);position:relative}
.frame.clip{overflow:hidden}
.frame.demo .dd,.frame.demo .so,.frame.demo .acct,.frame.demo .cart{position:static;box-shadow:none;border-radius:0}
.frame.demo .acct,.frame.demo .cart{width:100%;border:none;border-top:1px solid var(--border)}

/* ══════════ HEADER ══════════ */
.announce{background:var(--dark);padding:7px 28px;display:flex;align-items:center;justify-content:space-between}
.ann-text{font-size:10px;color:#E3B567}
.ann-text strong{color:var(--pink);font-weight:600}
.ann-links{display:flex;gap:20px}
.ann-link{font-size:10px;color:var(--sub-text)}
.nav{background:var(--card);border-bottom:1px solid var(--border);position:relative}
.nav-in{padding:0 28px;display:flex;align-items:center;height:72px}
.burger{display:none;width:36px;border:none;background:none;flex-direction:column;gap:4.5px;padding:0 7px}
.burger span{height:2px;background:var(--dark);border-radius:2px}
.burger span:nth-child(2){width:68%}
.logo{display:flex;align-items:center;gap:11px;margin-right:30px;flex-shrink:0}
.logo img{height:52px;width:auto;display:block}
.logo-wm{font-size:10px;color:var(--pink);font-weight:600;letter-spacing:.3px;line-height:1.25;max-width:76px}
.cats{display:flex;flex:1}
.cat{font-size:15px;font-weight:500;color:var(--sub-text);padding:0 14px;height:72px;display:flex;align-items:center;gap:6px;border:none;border-bottom:3px solid transparent;background:none;white-space:nowrap;position:relative}
.cat .car{font-size:9px;opacity:.6;transition:transform .18s}
.cat.on,.cat:hover{color:var(--pink);border-bottom-color:var(--pink);font-weight:600}
.cat.on .car{transform:rotate(180deg)}
.cat .new{font-size:8.5px;font-weight:700;background:var(--pink);color:#fff;border-radius:4px;padding:2px 6px;letter-spacing:.4px}
.right{display:flex;align-items:center;gap:9px;margin-left:auto}
.srch{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:22px;padding:10px 16px;font-size:13.5px;color:var(--sub-text);width:190px}
.lang{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.lang button{border:none;border-radius:6px;padding:6px 11px;font-size:12px;font-weight:700;background:none;color:var(--pink)}
.lang button.on{background:var(--pink);color:#fff}
.ico{width:40px;height:40px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative}
.ico .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.signin{background:none;border:1.5px solid var(--border);border-radius:10px;padding:10px 17px;font-size:13.5px;font-weight:600;color:var(--body-text);white-space:nowrap}
.signup{background:var(--pink);border:none;border-radius:10px;padding:11px 19px;font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap}

/* ── DROPDOWN ── */
.dd{position:absolute;left:0;right:0;top:100%;background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);box-shadow:0 14px 34px rgba(28,23,18,.13);z-index:120;display:none}
.dd.open{display:block}
.dd-in{padding:26px 28px 22px;display:grid;grid-template-columns:1.05fr 1fr 1fr 1.15fr;gap:30px}
.col-h{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.7px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-light)}
.dl{display:block;padding:7px 0;font-size:14px;color:var(--body-text)}
.dl:hover{color:var(--pink)}
.dl b{display:block;font-weight:600}
.dl small{display:block;font-size:11.5px;color:var(--sub-text);margin-top:1px;line-height:1.5}
.dl.lead{background:#FFF0F5;border:1px solid #F7C0D6;border-radius:11px;padding:12px 14px;margin-bottom:8px}
.dl.lead b{color:var(--pink)}
.dl .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dl .when{font-size:11px;color:var(--amber);font-weight:700;margin-left:6px}
.pill{font-size:9px;font-weight:700;letter-spacing:.4px;border-radius:4px;padding:2px 7px;margin-left:7px}
.pill.live{background:var(--d-bg);color:var(--d-tx);border:1px solid var(--d-bd)}
.pill.soon{background:var(--b-bg);color:var(--b-tx);border:1px solid var(--b-bd)}
.feat{background:var(--darkbar);border-radius:13px;padding:18px 20px;display:flex;flex-direction:column}
.feat.amber{background:var(--p-bg);border:1px solid var(--p-bd)}
.feat.data{background:var(--data-bg);border:1px solid var(--data-bd)}
.feat-l{font-size:9.5px;font-weight:700;letter-spacing:.6px;margin-bottom:9px}
.feat .feat-l{color:#E3B567}
.feat.amber .feat-l{color:var(--p-tx)}
.feat.data .feat-l{color:var(--data-tx)}
.feat-t{font-size:16px;font-weight:700;line-height:1.32;margin-bottom:7px;color:#fff}
.feat.amber .feat-t,.feat.data .feat-t{color:var(--dark)}
.feat-s{font-size:12.5px;line-height:1.7;color:#A99070;flex:1;margin-bottom:13px}
.feat.amber .feat-s,.feat.data .feat-s{color:var(--sub-text)}
.feat-b{border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;background:var(--pink);color:#fff;width:100%}
.feat.data .feat-b{background:var(--data-tx)}
.dd-foot{border-top:1px solid var(--border-light);background:#FCFAF6;padding:12px 28px;font-size:12.5px;color:var(--sub-text);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dd-foot b{color:var(--body-text);font-weight:600}
.dd-foot a{color:var(--pink);font-weight:700}
.live-now{display:flex;align-items:flex-start;gap:9px;background:var(--data-bg);border:1px solid var(--data-bd);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.ln-d{width:7px;height:7px;border-radius:50%;background:#3FBF6A;box-shadow:0 0 0 3px rgba(63,191,106,.2);flex-shrink:0}
.ln-t{display:block;font-size:9.5px;font-weight:700;color:var(--data-tx);letter-spacing:.5px}
.ln-v{display:block;font-size:13.5px;font-weight:700;color:var(--data-tx);margin-top:2px}

/* ── SEARCH OVERLAY ── */
.so{position:absolute;left:0;right:0;top:100%;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 14px 34px rgba(28,23,18,.13);z-index:130;padding:22px 28px 24px}
.so-f{display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--pink);border-radius:13px;padding:14px 18px;margin-bottom:18px}
.so-f input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--dark);font-family:inherit}
.so-esc{font-size:11px;color:var(--sub-text);border:1px solid var(--border);border-radius:6px;padding:4px 9px}
.so-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
.so-h{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;margin-bottom:10px}
.so-i{display:block;padding:6px 0;font-size:13.5px;color:var(--body-text)}
.so-i span{color:var(--sub-text);font-size:11.5px;margin-left:6px}
.so-chip{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12.5px;margin:0 6px 6px 0;color:var(--body-text)}

/* ── ACCOUNT MENU ── */
.acct{position:absolute;right:28px;top:100%;width:280px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 34px rgba(28,23,18,.16);z-index:130;overflow:hidden}
.acct-h{padding:15px 18px;border-bottom:1px solid var(--border-light);background:#FCFAF6}
.acct-n{font-size:15px;font-weight:700;color:var(--dark)}
.acct-e{font-size:12px;color:var(--sub-text);margin-top:2px}
.acct-i{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;font-size:13.5px;border-bottom:.5px solid var(--border-light)}
.acct-i:hover{background:var(--bg)}
.acct-i .n{font-size:10px;font-weight:700;background:var(--p-bg);color:var(--p-tx);border:1px solid var(--p-bd);border-radius:5px;padding:2px 7px}
.acct-o{padding:11px 18px;font-size:13.5px;color:var(--sub-text)}

/* ── MINI CART ── */
.cart{position:absolute;right:28px;top:100%;width:340px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 34px rgba(28,23,18,.16);z-index:130;overflow:hidden}
.cart-h{padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:baseline}
.cart-t{font-size:14px;font-weight:700;color:var(--dark)}
.cart-c{font-size:12px;color:var(--sub-text)}
.cart-i{display:flex;gap:12px;padding:13px 18px;border-bottom:.5px solid var(--border-light)}
.cart-th{width:46px;height:46px;border-radius:9px;flex-shrink:0}
.cart-n{font-size:13.5px;font-weight:600;color:var(--dark);line-height:1.3}
.cart-m{font-size:11.5px;color:var(--amber);font-weight:700;margin-top:3px}
.cart-p{font-size:13.5px;font-weight:700;color:var(--dark);margin-left:auto;white-space:nowrap}
.cart-f{padding:14px 18px;background:#FCFAF6}
.cart-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:11px}
.cart-row b{font-weight:700;color:var(--dark)}
.cart-b{width:100%;background:var(--pink);border:none;border-radius:11px;padding:12px;font-size:13.5px;font-weight:700;color:#fff}
.cart-note{font-size:11.5px;color:var(--sub-text);line-height:1.6;margin-top:10px;text-align:center}

/* ── MOBILE DRAWER ── */
.mob{max-width:390px;margin:0 auto;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:var(--card)}
.mob-top{display:flex;align-items:center;height:70px;padding:0 12px;gap:10px;border-bottom:1px solid var(--border)}
.mob-top .logo img{height:46px}
.mob-close{width:38px;height:38px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px}
.mob-srch{margin:14px 16px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 15px;font-size:14px;color:var(--sub-text)}
.mob-acc{border-top:1px solid var(--border-light)}
.mob-a{padding:15px 16px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;color:var(--dark);border-bottom:1px solid var(--border-light)}
.mob-a .car{font-size:12px;color:var(--sub-text)}
.mob-sub{background:var(--bg);padding:4px 16px 12px;border-bottom:1px solid var(--border-light)}
.mob-s{display:block;padding:10px 0;font-size:14.5px;color:var(--body-text);border-bottom:.5px solid var(--border)}
.mob-s:last-child{border-bottom:none}
.mob-s.lead{color:var(--pink);font-weight:700}
.mob-util{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--border-light)}
.mob-u{padding:9px 0;font-size:14px;color:var(--sub-text)}
.mob-cta{padding:16px}
.mob-b{width:100%;border:none;border-radius:12px;padding:14px;font-size:14.5px;font-weight:700;margin-bottom:9px}
.mob-b.pink{background:var(--pink);color:#fff}
.mob-b.wa{background:#1F9D52;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px}
.mob-b.ghost{background:none;border:1.5px solid var(--border);color:var(--body-text)}
.mob-lang{display:flex;gap:8px;padding:0 16px 18px}
.mob-lang button{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:11px;font-size:14px;font-weight:700;background:none;color:var(--body-text)}
.mob-lang button.on{background:var(--pink);border-color:var(--pink);color:#fff}

/* ── SPEC TABLE ── */
.spec{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px}
.spec-r{display:grid;grid-template-columns:210px 1fr;gap:18px;padding:13px 20px;border-bottom:.5px solid var(--border-light);font-size:13.5px}
.spec-r:last-child{border-bottom:none}
.spec-k{font-weight:700;color:var(--dark)}
.spec-v{color:var(--body-text);line-height:1.7}

@media (max-width:900px){
  .stage{padding:22px 14px 70px}
  .pv{padding:10px 14px}.pv-n{display:none}
  .dd-in,.so-g{grid-template-columns:1fr;gap:18px}
  .spec-r{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>

<div class="pv">
  <span class="pv-l">HEADER SYSTEM</span>
  <button class="pvb on" onclick="show('p1')">Phase 1</button>
  <button class="pvb" onclick="show('p2')">Phase 2</button>
  <button class="pvb" onclick="show('dd')">Dropdowns</button>
  <button class="pvb" onclick="show('search')">Search</button>
  <button class="pvb" onclick="show('acct')">Account &amp; cart</button>
  <button class="pvb" onclick="show('mobile')">Mobile drawer</button>
  <button class="pvb" onclick="show('spec')">Spec</button>
  <span class="pv-n">Hover a category to open its dropdown</span>
</div>

<div class="stage" id="stage"></div>

    <button class="mob-b wa">${WA} Join the Tapa Circle · ₹499/yr</button>
    <button class="mob-b pink">Create account</button>
    <button class="mob-b ghost">Sign in</button>
  </div>
  <div class="mob-lang"><button class="on">English</button><button>हिंदी</button></div>
</div>`;

const SPEC = [
 ['Nav height','72px desktop · 70px mobile. Logo 52px / 46px.'],
 ['Categories, Phase 1','Ritual Guides · Panchang · Dharmic Concepts. Three only.'],
 ['Categories, Phase 2','Adds Ritual Kits in fourth position with a NEW badge, plus the cart icon.'],
 ['Nav rule','A nav item must lead somewhere that works today. Purohit and Bhajan Mandali stay in the footer until they open.'],
 ['Dropdown grid','Four columns. Column 1 is the newcomer entry. Columns 2–3 are taxonomy and content. Column 4 is always a feature card, never more links.'],
 ['Dropdown footer','One line of editorial context on the left, one link on the right. Never a CTA.'],
 ['Open on','Hover with a 120ms delay on desktop; tap on touch. ESC closes. Only one open at a time.'],
 ['Search','Opens as a full-width panel under the nav. Groups results by category and returns glossary definitions above articles.'],
 ['Account','Signed out shows Sign in + Create account. Signed in replaces both with an avatar that opens this menu.'],
 ['Cart','Phase 2 only. Badge shows item count. Mini-cart states the cut-off on dated items and the cancellation rule.'],
 ['Mobile','Full-screen drawer. Accordions, one open at a time. Utility links and the Circle CTA sit below the categories.'],
 ['Language','EN / हिं toggle in the nav on desktop, at the foot of the drawer on mobile. One source of truth — not repeated in the breadcrumb.'],
 ['Announcement bar','Locked copy, 10px. Utility links right-aligned: Scripture References · Glossary · Our Editorial Method.'],
];

function show(k){
  document.querySelectorAll('.pvb').forEach((b,i)=>b.classList.toggle('on',['p1','p2','dd','search','acct','mobile','spec'][i]===k));
  const s=document.getElementById('stage');
  if(k==='p1') s.innerHTML=`<div class="lbl">PHASE 1 · 15 AUGUST — KNOWLEDGE LAYER</div><p class="note">Three categories. No cart. Sign in and Create account both shown.</p><div class="frame">${navHTML(1)}</div>`;
  else if(k==='p2') s.innerHTML=`<div class="lbl">PHASE 2 · PRE-BOOKING OPEN</div><p class="note">Ritual Kits enters fourth with a NEW badge. Cart appears with a count. Create account gives way to the cart.</p><div class="frame">${navHTML(2)}</div>`;
  else if(k==='dd') s.innerHTML=
    `<div class="lbl">RITUAL GUIDES</div><div class="frame demo">${navHTML(2,'rg')}</div>
     <div class="lbl">PANCHANG</div><div class="frame demo">${navHTML(2,'pa')}</div>
     <div class="lbl">DHARMIC CONCEPTS</div><div class="frame demo">${navHTML(2,'dc')}</div>
     <div class="lbl">RITUAL KITS · PHASE 2</div><div class="frame demo">${navHTML(2,'rk')}</div>`;
  else if(k==='search') s.innerHTML=`<div class="lbl">SEARCH PANEL</div><p class="note">Opens under the nav. Results grouped by category; glossary definitions rank above articles for definition queries.</p><div class="frame demo">${navHTML(2)}${SEARCH}</div>`;
  else if(k==='acct') s.innerHTML=`<div class="lbl">ACCOUNT MENU · SIGNED IN</div><div class="frame demo">${navHTML(2)}${ACCT}</div><div class="lbl">MINI CART · PHASE 2</div><div class="frame demo">${navHTML(2)}${CART}</div>`;
  else if(k==='mobile') s.innerHTML=`<div class="lbl">MOBILE DRAWER</div><p class="note">Full screen. Accordions, one open at a time. Ritual Guides shown expanded.</p>${MOBILE}`;
  else s.innerHTML=`<div class="lbl">HEADER SPEC</div><div class="spec">${SPEC.map(r=>`<div class="spec-r"><span class="spec-k">${r[0]}</span><span class="spec-v">${r[1]}</span></div>`).join('')}</div>`;
  bind();
}
function bind(){
  document.querySelectorAll('.cat[data-dd]').forEach(c=>{
    c.addEventListener('mouseenter',()=>{
      const nav=c.closest('.nav'), dd=nav.querySelector('.dd');
      nav.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); dd.innerHTML=DD[c.dataset.dd]; dd.classList.add('open');
    });
  });
  document.querySelectorAll('.nav').forEach(n=>n.addEventListener('mouseleave',()=>{
    n.querySelector('.dd').classList.remove('open');
    n.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
  }));
}
show('p1');
</script>
</body>
</html>
