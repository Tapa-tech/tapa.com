<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ritual Card — The Tapa Co.</title>
<style>
/* ============================================================
   THE TAPA CO. — RITUAL CARD
   Seven blocks · A5 portrait · one page · print-safe in greyscale
   Used during the ritual, often with wet hands. Nothing is tappable.
   ============================================================ */
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --darkbar:#1A1208;
  --pink:#FD066D; --amber:#E8A020; --gold:#A07800; --yellow:#EDAB3A;
  --body-text:#2C2010; --mid-text:#5C4B12; --sub-text:#8A7A68;
  --border:#E8E0D0; --border-light:#F0E8D8;
  --hero-text:#FFFDF5; --dim:#7A6A55;
  --d-bg:#E6F1E6; --d-tx:#27500A; --d-bd:#C9DFC9;
  --p-bg:#FFF8E6; --p-tx:#A07800; --p-bd:#EFE0B8;
  --b-bg:#F0E9E1; --b-tx:#4A3525; --b-bd:#D9CBB8;
  --ink:#1A1208;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#E4DDD0;color:var(--body-text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

.top{background:#2E2260;padding:11px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.top-l{font-size:9.5px;font-weight:700;color:#B9A9DC;letter-spacing:.7px}
.tb{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:600;color:#D8CEF0}
.tb.on{background:#fff;color:#2E2260;border-color:#fff}
.top-n{margin-left:auto;font-size:10.5px;color:#9A8AC0;font-style:italic}

.stage{display:grid;grid-template-columns:auto 1fr;gap:40px;padding:30px 32px 80px;max-width:1400px;margin:0 auto;align-items:start}
.sheet{width:794px;background:#fff;box-shadow:0 10px 40px rgba(28,23,18,.16);flex-shrink:0}
.notes{max-width:480px}
.n-ey{font-size:9.5px;font-weight:700;color:var(--pink);letter-spacing:.8px;margin-bottom:7px}
.n-t{font-size:25px;font-weight:700;color:var(--dark);letter-spacing:-.5px;line-height:1.22;margin-bottom:12px}
.n-p{font-size:14.5px;line-height:1.82;margin-bottom:13px}
.n-p b{font-weight:600;color:var(--dark)}
.n-box{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:11px}
.n-bh{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;margin-bottom:9px}
.n-r{display:flex;gap:10px;padding:6px 0;font-size:13.5px;line-height:1.7}
.n-r span:first-child{color:var(--pink);font-weight:700;flex-shrink:0;min-width:14px}
.n-rule{background:var(--darkbar);border-radius:13px;padding:16px 18px;margin-bottom:11px}
.n-rl{font-size:9.5px;font-weight:700;color:#E3B567;letter-spacing:.6px;margin-bottom:8px}
.n-rt{font-size:14.5px;color:var(--hero-text);line-height:1.75}
.n-rt b{color:var(--amber)}
.n-warn{background:var(--p-bg);border:1px solid var(--p-bd);border-radius:13px;padding:15px 17px;font-size:13.5px;line-height:1.78;margin-bottom:11px}
.n-warn b{color:var(--p-tx)}

/* ══════════ THE CARD ══════════ */
.c{padding:0;color:var(--ink)}

/* 1 · MASTHEAD */
.c1{background:var(--ink);padding:22px 30px 20px;position:relative}
.c1-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.c1-mark{display:flex;align-items:center;gap:9px}
.c1-mark img{height:34px;width:auto}
.c1-wm{font-size:8px;color:#FF9EBE;font-weight:600;letter-spacing:.3px;line-height:1.25;max-width:52px}
.c1-cat{font-size:8.5px;font-weight:700;color:#E3B567;letter-spacing:.8px;text-align:right;line-height:1.6}
.c1-t{font-size:30px;font-weight:700;color:#FFFDF5;line-height:1.12;letter-spacing:-.6px;margin-bottom:8px}
.c1-s{font-size:13px;color:#C4A882;line-height:1.6}
.c1-meta{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);flex-wrap:wrap}
.c1-m{font-size:11px;color:#A99070}
.c1-m b{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:2px}

/* 2 · TIMINGS */
.c2{background:#F7F2E8;padding:18px 30px;border-bottom:1.5px solid var(--ink)}
.blk-l{font-size:9px;font-weight:700;color:var(--gold);letter-spacing:.9px;margin-bottom:11px}
.c2-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c2-i{border-left:3px solid var(--ink);padding-left:12px}
.c2-k{font-size:9.5px;font-weight:700;color:var(--mid-text);letter-spacing:.5px;margin-bottom:3px}
.c2-v{font-size:19px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.3px}
.c2-n{font-size:11px;color:var(--sub-text);margin-top:3px;line-height:1.5}
.c2-warn{margin-top:13px;padding-top:12px;border-top:1px dashed #C9BFAC;font-size:11.5px;line-height:1.65;color:var(--mid-text)}
.c2-warn b{color:var(--ink)}

/* 3 · SAMAGRI */
.c3{padding:20px 30px;border-bottom:none}
.c3-g{display:grid;grid-template-columns:1fr 1fr;gap:3px 22px}
.c3-i{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px;line-height:1.5}
.c3-b{width:13px;height:13px;border:1.5px solid var(--ink);border-radius:2px;flex-shrink:0;margin-top:2px}
.c3-n{font-size:10.5px;color:var(--sub-text);display:block;margin-top:1px}
.c3-note{margin-top:13px;font-size:11.5px;color:var(--mid-text);line-height:1.65;padding-top:11px;border-top:1px dashed #C9BFAC}
.c3-note b{color:var(--ink)}

/* 4 · VIDHI */
.c4{padding:20px 30px;border-bottom:1.5px solid var(--ink)}
.c4-i{display:flex;gap:12px;padding:7px 0;border-bottom:.5px solid #EDE6D8}
.c4-i:last-child{border-bottom:none}
.c4-n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.c4-t{font-size:13px;line-height:1.6;color:var(--ink)}
.c4-t b{font-weight:700}
.c4-t i{font-style:normal;color:var(--sub-text);font-size:11.5px;display:block;margin-top:1px}

/* 5 · MANTRA */
.c5{background:var(--ink);padding:20px 30px}
.c5 .blk-l{color:#E3B567}
.c5-d{font-size:22px;color:#F5C86A;line-height:1.55;margin-bottom:7px}
.c5-r{font-size:13px;color:#fff;font-weight:600;margin-bottom:4px}
.c5-m{font-size:11.5px;color:#A99070;line-height:1.6}
.c5-cnt{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.c5-ck{font-size:10.5px;color:#A99070}
.c5-boxes{display:flex;gap:5px;margin-left:auto}
.c5-boxes i{width:15px;height:15px;border:1.5px solid rgba(255,255,255,.4);border-radius:2px;display:block}

/* 6 · FASTING */
.c6{padding:18px 30px;border-bottom:none}
.c6-g{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.c6-i{border:1px solid #D8CFBC;border-radius:8px;padding:11px 12px}
.c6-t{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px}
.c6-s{font-size:11px;color:var(--mid-text);line-height:1.55}
.c6-note{margin-top:12px;font-size:12px;line-height:1.7;color:var(--ink);background:#F0F5EE;border-left:3px solid var(--d-tx);padding:10px 13px}
.c6-note b{color:var(--d-tx)}

/* 7 · FOOTER */
.c7{background:#F7F2E8;padding:16px 30px 20px}
.c7-src{font-size:11px;color:var(--mid-text);line-height:1.7;margin-bottom:11px}
.c7-src b{color:var(--ink);font-weight:700}
.c7-b{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:12px;border-top:1px solid #DDD4C0}
.c7-tag{font-size:13px;font-weight:700;color:var(--ink);line-height:1.4}
.c7-tag em{color:var(--pink);font-style:normal}
.c7-u{font-size:10.5px;color:var(--sub-text);margin-top:4px;line-height:1.6}
.c7-qr{width:60px;height:60px;border:1.5px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--sub-text);text-align:center;line-height:1.3;flex-shrink:0;padding:4px}


/* ── A4 TWO-COLUMN BODY ── */
.cols{display:grid;grid-template-columns:1fr 1fr}
.cols>div{border-right:1.5px solid var(--ink)}
.cols>div:last-child{border-right:none}
.c1{padding:20px 26px 18px}
.c1-t{font-size:27px}
.c2,.c3,.c4,.c5,.c6{padding:15px 22px}
.c2-g{grid-template-columns:1fr;gap:11px}
.c2-v{font-size:17px}
.c3-g{grid-template-columns:1fr;gap:0}
.c3-i{font-size:12px;padding:4px 0}
.c4-i{padding:6px 0}
.c4-t{font-size:12px;line-height:1.55}
.c5-d{font-size:19px}
.c6-g{grid-template-columns:1fr;gap:8px}
.c6-i{padding:9px 11px}
.c7{padding:14px 26px 16px}
.blk-l{margin-bottom:9px}
.full{grid-column:1/-1;border-right:none}


/* ── A4 FIT ── */
.c1{padding:14px 24px 12px}
.c1-t{font-size:24px;margin-bottom:6px}
.c1-top{margin-bottom:11px}
.c1-mark img{height:29px}
.c1-s{font-size:12px}
.c1-meta{margin-top:10px;padding-top:10px;gap:16px}
.c1-m b{font-size:13px}
.c2,.c3,.c4,.c5,.c6{padding:11px 20px}
.blk-l{margin-bottom:7px;font-size:8.5px}
.c2-g{gap:9px}
.c2-v{font-size:16px}
.c2-n{font-size:10.5px;margin-top:2px}
.c2-warn{margin-top:10px;padding-top:9px;font-size:11px}
.c3-i{font-size:11.5px;padding:2.5px 0}
.c3-n{font-size:10px}
.c3-note{margin-top:10px;padding-top:9px;font-size:11px}
.c4-i{padding:3.5px 0}
.c4-t{font-size:11.5px;line-height:1.5}
.c4-t i{font-size:10.5px}
.c4-n{width:18px;height:18px;font-size:10px}
.c5-d{font-size:17px;margin-bottom:5px}
.c5-r{font-size:12px}
.c5-m{font-size:11px}
.c5-cnt{margin-top:10px;padding-top:10px}
.c6-g{gap:7px}
.c6-i{padding:7px 10px}
.c6-t{font-size:11.5px;margin-bottom:3px}
.c6-s{font-size:10.5px}
.c6-note{margin-top:9px;padding:8px 11px;font-size:11px}
.c7{padding:11px 24px 14px}
.c7-src{font-size:10px;margin-bottom:9px}
.c7-b{padding-top:9px}
.c7-tag{font-size:12px}
.c7-u{font-size:9.5px}
.c7-qr{width:52px;height:52px;font-size:7.5px}

/* GREYSCALE PROOF */
.grey{filter:grayscale(1) contrast(1.06)}

@media (max-width:1100px){
  .stage{grid-template-columns:1fr;padding:20px 14px 60px;gap:24px}
  .sheet{width:100%;max-width:560px;margin:0 auto}
  .top{padding:10px 14px}.top-n{display:none}
}
</style>
</head>
<body>

<div class="top">
  <span class="top-l">RITUAL CARD</span>
  <button class="tb on" onclick="show('nav')">Navratri</button>
  <button class="tb" onclick="show('ekad')">Aja Ekadashi</button>
  <button class="tb" onclick="show('grey')">Greyscale proof</button>
  <button class="tb" onclick="show('spec')">Spec</button>
  <span class="top-n">A4 portrait · one sheet · nothing tappable</span>
</div>

<div class="stage">
  <div class="sheet" id="sheet"></div>
  <div class="notes" id="notes"></div>
</div>

N.nav=`<div class="n-ey">RITUAL GUIDE CARD</div><div class="n-t">Sharad Navratri</div>
<p class="n-p">A4 portrait, one sheet, seven blocks in a fixed order: <b>masthead · when · what you need · what to do · what to say · fasting · source and footer</b>.</p>
<div class="n-rule"><div class="n-rl">THE CONSTRAINT THAT SHAPED IT</div><p class="n-rt">This is read <b>during</b> the ritual, often with wet hands, propped against something. Nothing is tappable, nothing scrolls, and nothing is below a fold — because there is no fold.</p></div>
<div class="n-box"><div class="n-bh">DECISIONS</div>
  <div class="n-r"><span>·</span><span><b>Checkboxes are printable squares</b>, not app checkboxes. Ticked with a pen at the market.</span></div>
  <div class="n-r"><span>·</span><span><b>Timings are the largest type on the page</b> after the title. They are what someone glances down for.</span></div>
  <div class="n-r"><span>·</span><span><b>The mantra block is inverted</b> — dark on light — so it is findable without reading.</span></div>
  <div class="n-r"><span>·</span><span><b>Nine boxes for japa rounds.</b> A paper counter, because a phone is put away during the puja.</span></div>
</div>
<div class="n-warn"><b>No commerce anywhere on the card.</b> No kit, no Circle, no QR to a product. The QR goes to the guide. A card that sells is a card nobody keeps beside a diya.</div>`;

N.ekad=`<div class="n-ey">VRAT CARD</div><div class="n-t">Aja Ekadashi</div>
<p class="n-p">Same seven blocks, different weight. For a vrat the <b>parana window</b> is the whole point, so block 1 gives it equal billing with the start and the warning sits directly beneath.</p>
<div class="n-box"><div class="n-bh">WHAT CHANGES BY RITUAL TYPE</div>
  <div class="n-r"><span>·</span><span><b>Block 5 flexes.</b> Fasting forms on a festival card; what counts as a grain on an Ekadashi card.</span></div>
  <div class="n-r"><span>·</span><span><b>Samagri shortens.</b> Six items, and the card says why — "Ekadashi asks for restraint rather than arrangement."</span></div>
  <div class="n-r"><span>·</span><span><b>The correction travels.</b> "Nirjala is one form some choose — it is not what the vrat asks for" sits inside step 2, where the decision is made.</span></div>
</div>
<div class="n-rule"><div class="n-rl">REGENERATION</div><p class="n-rt">Every dated field — the date, the tithi, both timings, the city — is a <b>variable, not typed copy</b>. When the Panchang record changes, the card regenerates. Nobody edits a PDF.</p></div>`;

N.grey=`<div class="n-ey">PRINT PROOF</div><div class="n-t">It has to work in black and white</div>
<p class="n-p">Most of these will be printed at home, on a laser printer, in greyscale. If the design depends on colour it fails at the moment it matters.</p>
<div class="n-box"><div class="n-bh">WHAT SURVIVES</div>
  <div class="n-r"><span>✓</span><span>Block separation — solid rules, not colour changes.</span></div>
  <div class="n-r"><span>✓</span><span>Hierarchy — size and weight, not hue.</span></div>
  <div class="n-r"><span>✓</span><span>The mantra block — inverted, so it stays findable.</span></div>
  <div class="n-r"><span>✓</span><span>Checkbox squares — outlined, never filled.</span></div>
</div>
<div class="n-warn"><b>One thing to watch.</b> The pink in "Only devotion" goes mid-grey. That is acceptable on a footer line but would not be on anything load-bearing — which is why no timing, step or correction uses colour to carry meaning.</div>`;

N.spec=`<div class="n-ey">SPECIFICATION</div><div class="n-t">Seven blocks, fixed order</div>
<div class="n-box"><div class="n-bh">BLOCKS</div>
  <div class="n-r"><span>1</span><span><b>Masthead</b> — mark, category, ritual name, one-line description, then date, tithi and city.</span></div>
  <div class="n-r"><span>2</span><span><b>When</b> — two timing panels and the one caveat that matters. Largest numerals on the page.</span></div>
  <div class="n-r"><span>3</span><span><b>What you need</b> — two columns, printable checkboxes, substitution note.</span></div>
  <div class="n-r"><span>4</span><span><b>What to do</b> — numbered steps, condensed. Pratha marked inline in grey.</span></div>
  <div class="n-r"><span>5</span><span><b>What to say</b> — Devanagari, transliteration, one line of context, japa boxes. Inverted.</span></div>
  <div class="n-r"><span>6</span><span><b>Fasting or the category rule</b> — three panels plus the reassurance line.</span></div>
  <div class="n-r"><span>7</span><span><b>Source and footer</b> — text and score, Pratha called out, panchang source, tagline, URL, QR.</span></div>
</div>
<div class="n-box"><div class="n-bh">FORMAT</div>
  <div class="n-r"><span>·</span><span>A4 portrait, 210 × 297 mm, two columns. One sheet, the paper every home printer holds.</span></div>
  <div class="n-r"><span>·</span><span>Single page. If content will not fit, cut steps — never spill to page two.</span></div>
  <div class="n-r"><span>·</span><span>Minimum type 10.5px. Nothing smaller, at any zoom.</span></div>
  <div class="n-r"><span>·</span><span>Greyscale-safe. Colour is decoration, never information.</span></div>
</div>
<div class="n-rule"><div class="n-rl">BY CATEGORY</div><p class="n-rt">Ritual Guides get the full card. <b>Panchang gets a calendar download instead.</b> Dharmic Concepts get a download or nothing. Beginner's Guides get a shopping checklist, not this.</p></div>`;

function show(k){
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('on',['nav','ekad','grey','spec'][i]===k));
  const s=document.getElementById('sheet');
  s.className='sheet';
  if(k==='nav') s.innerHTML=NAV;
  else if(k==='ekad') s.innerHTML=EKAD;
  else if(k==='grey'){s.innerHTML=NAV;s.classList.add('grey');}
  else s.innerHTML=NAV;
  document.getElementById('notes').innerHTML=N[k];
}
show('nav');
</script>
</body>
</html>
