<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Search & System Pages — The Tapa Co.</title>
<style>
/* ============================================================
   THE TAPA CO. — SEARCH RESULTS + SYSTEM PAGES
   Glossary definitions rank above articles for definition queries.
   Error pages: no fear, no dead ends, always a route out.
   ============================================================ */
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --darkbar:#1A1208;
  --pink:#FD066D; --amber:#E8A020; --gold:#A07800; --yellow:#EDAB3A;
  --body-text:#2C2010; --mid-text:#5C4B12; --sub-text:#8A7A68;
  --border:#E8E0D0; --border-light:#F0E8D8;
  --hero-text:#FFFDF5; --dim:#7A6A55; --dimmer:#5C4E36;
  --d-bg:#E6F1E6; --d-tx:#27500A; --d-bd:#C9DFC9;
  --p-bg:#FFF8E6; --p-tx:#A07800; --p-bd:#EFE0B8;
  --b-bg:#F0E9E1; --b-tx:#4A3525; --b-bd:#D9CBB8;
  --data-bg:#EEF3F7; --data-tx:#1F4460; --data-bd:#C3D6E4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--body-text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}

.prev{background:#2E2260;padding:10px 40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prev-l{font-size:9.5px;font-weight:700;color:#B9A9DC;letter-spacing:.7px}
.prev-b{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:600;color:#D8CEF0}
.prev-b.on{background:#fff;color:#2E2260;border-color:#fff}
.prev-n{margin-left:auto;font-size:10.5px;color:#9A8AC0;font-style:italic}

/* NAV */
.announce{background:var(--dark);padding:7px 40px;display:flex;align-items:center;justify-content:space-between}
.ann-text{font-size:10px;color:#E3B567}
.ann-text strong{color:var(--pink);font-weight:600}
.ann-links{display:flex;gap:20px}
.ann-link{font-size:10px;color:var(--sub-text)}
.topnav{background:var(--card);border-bottom:1px solid var(--border)}
.topnav-in{max-width:1280px;margin:0 auto;padding:0 40px;display:flex;align-items:center;height:72px}
.burger{display:none;width:36px;border:none;background:none;flex-direction:column;gap:4.5px;padding:0 7px}
.burger span{height:2px;background:var(--dark);border-radius:2px}
.burger span:nth-child(2){width:68%}
.logo{display:flex;align-items:center;gap:11px;margin-right:30px;flex-shrink:0}
.logo img{height:52px;width:auto;display:block}
.logo-wm{font-size:10px;color:var(--pink);font-weight:600;letter-spacing:.3px;line-height:1.25;max-width:76px}
.navcats{display:flex;flex:1}
.navcat{font-size:15px;font-weight:500;color:var(--sub-text);padding:0 14px;height:72px;display:flex;align-items:center;border:none;border-bottom:3px solid transparent;background:none;white-space:nowrap}
.navright{display:flex;align-items:center;gap:10px;margin-left:auto}
.nav-act{width:40px;height:40px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-login{white-space:nowrap;background:var(--pink);border:none;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:700;color:#fff}

/* SEARCH BAR */
.sbar{background:var(--darkbar);padding:26px 40px 24px}
.sbar-in{max-width:1280px;margin:0 auto}
.sf{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.24);border-radius:14px;padding:15px 20px;max-width:760px}
.sf input{flex:1;background:none;border:none;outline:none;font-size:17px;color:#fff;font-family:inherit}
.sf-go{background:var(--pink);border:none;border-radius:10px;padding:9px 20px;font-size:13.5px;font-weight:700;color:#fff}
.sf-x{font-size:19px;color:var(--dim)}
.sres{font-size:13.5px;color:#C4A882;margin-top:14px}
.sres b{color:#fff;font-weight:700}

/* FILTERS */
.filters{background:var(--card);border-bottom:1px solid var(--border);padding:13px 40px}
.f-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fc{background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--body-text);white-space:nowrap}
.fc.on{border-color:var(--pink);background:#FFF0F5;color:var(--pink);font-weight:700}
.fc .n{font-size:10.5px;color:var(--sub-text);margin-left:6px}
.fc.on .n{color:var(--pink)}

/* LAYOUT */
.layout{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start;padding:28px 0 60px}
.main{max-width:760px}

/* DID YOU MEAN */
.dym{background:var(--p-bg);border:1px solid var(--p-bd);border-radius:13px;padding:14px 18px;font-size:14.5px;line-height:1.7;margin-bottom:20px}
.dym b{color:var(--p-tx);font-weight:700}
.dym a{color:var(--pink);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* GLOSSARY ANSWER — ranks above articles */
.gans{background:var(--card);border:1.5px solid var(--p-bd);border-radius:16px;overflow:hidden;margin-bottom:26px}
.ga-h{background:var(--p-bg);padding:10px 20px;border-bottom:1px solid var(--p-bd);font-size:9.5px;font-weight:700;color:var(--p-tx);letter-spacing:.6px}
.ga-b{padding:18px 20px}
.ga-t{font-size:23px;font-weight:700;color:var(--dark);line-height:1.2}
.ga-dev{font-family:'Tiro Devanagari Hindi','Noto Sans Devanagari',serif;font-size:24px;color:var(--gold);line-height:1.5;margin:2px 0 8px}
.ga-m{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.ga-say{font-size:13px;color:var(--sub-text);font-style:italic}
.ga-dot{color:#CFC3AE;font-size:11px}
.ga-tag{font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 9px;border-radius:5px;background:var(--bg);color:var(--mid-text);border:1px solid var(--border)}
.ga-d{font-size:15px;line-height:1.8;color:var(--body-text);margin-bottom:13px}
.ga-f{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--border-light)}
.ga-l{font-size:9.5px;font-weight:700;color:var(--sub-text);letter-spacing:.5px;margin-right:2px}
.ga-a{font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 11px;color:var(--mid-text);font-weight:500}
.ga-a.c{background:#FFF0F5;border-color:#F7C0D6;color:var(--pink);font-weight:700}

/* RESULT GROUPS */
.grp{margin-bottom:28px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.grp-t{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.7px}
.grp-a{font-size:12px;color:var(--pink);font-weight:700}
.r{display:flex;gap:16px;padding:14px 0;border-bottom:.5px solid var(--border-light)}
.r:last-child{border-bottom:none}
.r-th{width:74px;height:74px;border-radius:11px;flex-shrink:0}
.r-n{flex:1;min-width:0}
.r-c{display:block;font-size:10.5px;font-weight:700;color:var(--sub-text);letter-spacing:.4px;margin-bottom:4px}
.r-t{display:block;font-size:17px;font-weight:700;color:var(--dark);line-height:1.3;margin-bottom:4px}
.r-t em{font-style:normal;background:#FFF0C4;padding:0 2px;border-radius:2px}
.r-s{display:block;font-size:13.5px;color:var(--sub-text);line-height:1.68;margin-bottom:8px}
.r-s em{font-style:normal;background:#FFF0C4;padding:0 2px;border-radius:2px}
.r-m{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{font-size:10px;padding:3px 9px;border-radius:5px;font-weight:700}
.pill.d{background:var(--d-bg);color:var(--d-tx);border:1px solid var(--d-bd)}
.pill.n{background:var(--bg);color:var(--sub-text);border:1px solid var(--border)}
.pill.dt{background:var(--data-bg);color:var(--data-tx);border:1px solid var(--data-bd)}
.h-devi{background:linear-gradient(150deg,#5C1A30,#A83358)}
.h-shiva{background:linear-gradient(150deg,#1A1440,#3A2E70)}
.h-vishnu{background:linear-gradient(150deg,#0C2A3A,#1B5670)}
.h-ganesh{background:linear-gradient(150deg,#6B3410,#B5651D)}
.h-data{background:linear-gradient(150deg,#1B3A52,#0C1A26)}
.h-earth{background:linear-gradient(150deg,#2C1C10,#6B4A28)}

/* SIDEBAR */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:13px}
.sbx{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.sbx-h{padding:12px 16px;border-bottom:1px solid var(--border-light);font-size:12.5px;font-weight:700;color:var(--dark)}
.sbx-i{display:block;padding:10px 16px;border-bottom:.5px solid var(--border-light);font-size:13.5px;color:var(--body-text)}
.sbx-i:last-child{border-bottom:none}
.sbx-i span{display:block;font-size:11.5px;color:var(--sub-text);margin-top:2px}
.chips{padding:14px 16px;display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--body-text)}
.sbn{background:var(--p-bg);border:1px solid var(--p-bd);border-radius:14px;padding:15px 17px}
.sbn-h{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.6px;margin-bottom:9px}
.sbn-t{font-size:13px;line-height:1.75;color:var(--body-text)}
.sbn-t b{color:var(--p-tx)}

/* EMPTY */
.empty{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 36px;text-align:center;margin-bottom:24px}
.e-i{font-size:36px;margin-bottom:14px}
.e-t{font-size:24px;font-weight:700;color:var(--dark);line-height:1.28;margin-bottom:10px;letter-spacing:-.4px}
.e-s{font-size:15px;color:var(--sub-text);line-height:1.8;max-width:460px;margin:0 auto 20px}
.e-b{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.eb{border:none;border-radius:11px;padding:12px 22px;font-size:13.5px;font-weight:700}
.eb.pink{background:var(--pink);color:#fff}
.eb.ghost{background:var(--card);border:1.5px solid var(--border);color:var(--body-text)}

/* ══ SYSTEM PAGES ══ */
.sys{min-height:640px;display:flex;align-items:center;position:relative;overflow:hidden}
.sys.e404{background:linear-gradient(155deg,#2A1408 0%,#6B3410 42%,#1C0C04 100%)}
.sys.e500{background:linear-gradient(155deg,#1A1208 0%,#3A2A12 42%,#120C04 100%)}
.sys.off{background:linear-gradient(155deg,#0C1A26 0%,#1B3A52 42%,#070F17 100%)}
.sys::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 78% 40%,rgba(255,255,255,.05) 0%,transparent 62%)}
.sys-in{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:56px 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;width:100%}

.sys-badge{display:inline-flex;align-items:baseline;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:11px 20px 12px;margin-bottom:20px}
.sys-num{font-size:38px;font-weight:700;color:var(--yellow);line-height:1;letter-spacing:-1.5px}
.sys-num.word{font-size:24px;letter-spacing:.5px}
.sys-lab{font-size:11px;font-weight:700;color:rgba(255,253,245,.72);letter-spacing:1px;line-height:1.5}
.sys-lab b{display:block;color:#fff;font-size:12.5px}
@media (max-width:900px){.sys-num{font-size:31px}.sys-num.word{font-size:20px}}
.sys-code{display:none;font-size:11px;font-weight:700;color:#E3B567;letter-spacing:1.2px;margin-bottom:16px}
.sys-h{font-size:42px;font-weight:700;color:#FFFDF5;line-height:1.1;letter-spacing:-1px;margin-bottom:16px}
.sys-h em{color:var(--yellow);font-style:normal}
.sys-p{font-size:17px;color:rgba(255,253,245,.72);line-height:1.8;margin-bottom:14px;max-width:520px}
.sys-src{font-size:13px;color:rgba(255,253,245,.45);line-height:1.75;font-style:italic;margin-bottom:26px;padding-left:16px;border-left:2px solid rgba(227,181,103,.35);max-width:480px}
.sys-b{display:flex;gap:11px;flex-wrap:wrap}
.sb-p{background:#fff;border:none;border-radius:11px;padding:14px 24px;font-size:14.5px;font-weight:700;color:#1C1712}
.sb-g{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:11px;padding:14px 22px;font-size:14.5px;font-weight:600;color:#FFFDF5}
.sys-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:20px 22px}
.sc-h{font-size:9.5px;font-weight:700;color:#E3B567;letter-spacing:.7px;margin-bottom:13px}
.sc-i{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:.5px solid rgba(255,255,255,.09);font-size:14px;color:rgba(255,253,245,.85)}
.sc-i:last-child{border-bottom:none}
.sc-i span:last-child{color:#E3B567;font-size:15px}
.sc-n{font-size:12px;color:rgba(255,253,245,.5);line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09)}

@media (max-width:900px){
  body{max-width:430px;margin:0 auto}
  .wrap{padding:0 16px}
  .prev{padding:9px 16px;gap:7px}.prev-n{display:none}
  .announce{padding:7px 16px;justify-content:center}.ann-links{display:none}.ann-text{font-size:9.5px;text-align:center}
  .topnav-in{padding:0 12px;height:70px;gap:10px}
  .burger{display:flex}.logo{margin-right:auto;gap:9px}.logo img{height:46px}
  .navcats,.nav-login{display:none}
  .sbar{padding:18px 16px}
  .sf{padding:13px 15px}.sf input{font-size:15px;min-width:0}
  .filters{padding:11px 16px;overflow-x:auto}
  .f-in{flex-wrap:nowrap}
  .layout{grid-template-columns:1fr;gap:0;padding:20px 0 50px}
  .main{max-width:none}
  .side{position:static;margin-top:26px}
  .r{gap:12px}.r-th{width:58px;height:58px}
  .r-t{font-size:15.5px}
  .sys{min-height:0}
  .sys-in{grid-template-columns:1fr;gap:26px;padding:36px 16px}
  .sys-h{font-size:29px}
  .sys-p{font-size:15px}
  .empty{padding:30px 20px}
  .e-t{font-size:20px}
}
</style>
</head>
