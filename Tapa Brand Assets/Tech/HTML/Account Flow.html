<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Account Workflow — The Tapa Co.</title>
<style>
/* ============================================================
   THE TAPA CO. — ACCOUNT WORKFLOW
   Three sign-in methods · guest checkout · account gates on
   save, reminders and order tracking. Ritual cards stay free.
   ============================================================ */
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --darkbar:#1A1208;
  --pink:#FD066D; --amber:#E8A020; --gold:#A07800; --yellow:#EDAB3A;
  --body-text:#2C2010; --mid-text:#5C4B12; --sub-text:#8A7A68;
  --border:#E8E0D0; --border-light:#F0E8D8;
  --hero-text:#FFFDF5; --dim:#7A6A55;
  --d-bg:#E6F1E6; --d-tx:#27500A; --d-bd:#C9DFC9;
  --p-bg:#FFF8E6; --p-tx:#A07800; --p-bd:#EFE0B8;
  --b-bg:#F0E9E1; --b-tx:#4A3525; --b-bd:#D9CBB8;
  --data-bg:#EEF3F7; --data-tx:#1F4460; --data-bd:#C3D6E4;
  --wa:#1F9D52;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#EDE7DC;color:var(--body-text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}

/* SHELL */
.top{background:#2E2260;padding:11px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
.top-l{font-size:9.5px;font-weight:700;color:#B9A9DC;letter-spacing:.7px}
.top-n{margin-left:auto;font-size:10.5px;color:#9A8AC0;font-style:italic}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 44px)}
.rail{background:#fff;border-right:1px solid var(--border);padding:18px 0 60px;position:sticky;top:44px;height:calc(100vh - 44px);overflow-y:auto}
.rg{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.7px;padding:14px 20px 7px}
.ri{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;color:var(--body-text);border-left:3px solid transparent}
.ri:hover{background:var(--bg)}
.ri.on{background:#FFF0F5;border-left-color:var(--pink);color:var(--pink);font-weight:700}
.ri-n{font-size:10.5px;color:var(--sub-text);min-width:16px}
.ri.on .ri-n{color:var(--pink)}
.main{padding:26px 32px 80px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:start}

/* PHONE FRAME */
.phone{width:390px;border:1px solid var(--border);border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 8px 30px rgba(28,23,18,.10);flex-shrink:0}
.ph-bar{height:26px;background:var(--dark);display:flex;align-items:center;justify-content:center}
.ph-bar span{width:70px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.ph-body{min-height:660px;display:flex;flex-direction:column}

/* NOTES */
.notes{max-width:520px}
.n-ey{font-size:9.5px;font-weight:700;color:var(--pink);letter-spacing:.8px;margin-bottom:7px}
.n-t{font-size:25px;font-weight:700;color:var(--dark);letter-spacing:-.5px;line-height:1.22;margin-bottom:11px}
.n-p{font-size:14.5px;line-height:1.82;color:var(--body-text);margin-bottom:13px}
.n-p b{font-weight:600;color:var(--dark)}
.n-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:11px}
.n-bh{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;margin-bottom:9px}
.n-r{display:flex;gap:10px;padding:6px 0;font-size:13.5px;line-height:1.7}
.n-r span:first-child{color:var(--pink);font-weight:700;flex-shrink:0}
.n-warn{background:var(--p-bg);border:1px solid var(--p-bd);border-radius:13px;padding:15px 17px;font-size:13.5px;line-height:1.78;margin-bottom:11px}
.n-warn b{color:var(--p-tx)}
.n-rule{background:var(--darkbar);border-radius:13px;padding:16px 18px;margin-bottom:11px}
.n-rl{font-size:9.5px;font-weight:700;color:#E3B567;letter-spacing:.6px;margin-bottom:8px}
.n-rt{font-size:14.5px;color:var(--hero-text);line-height:1.75}
.n-rt b{color:var(--amber)}


/* ── AUTH BACKDROP ── */
.body.auth{position:relative;padding:0;overflow:hidden}
.auth-in .mark{margin-bottom:22px}
.auth-in .h1{text-shadow:0 1px 0 rgba(255,255,255,.6)}
.auth-bg{position:absolute;inset:0;z-index:0}
.auth-bg img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.auth-scrim{position:absolute;inset:0;z-index:1;backdrop-filter:blur(2px);background:linear-gradient(to bottom,rgba(96,4,42,.72) 0%,rgba(112,5,49,.88) 26%,rgba(122,6,53,.94) 62%,rgba(130,6,56,.96) 100%)}
.auth-in{position:relative;z-index:2;padding:26px 18px 20px;flex:1;display:flex;flex-direction:column}
.auth-in .inp{background:rgba(255,255,255,.9);backdrop-filter:blur(4px)}
.auth-in .btn.google,.auth-in .btn.ghost{background:rgba(255,255,255,.9);backdrop-filter:blur(4px)}

.auth-in .h1{color:#FFFDF5;text-shadow:none}
.auth-in .sub{color:rgba(255,235,242,.78)}
.auth-in .sub b{color:#fff}
.auth-in .lbl{color:#FFB8D2}
.auth-in .inp{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff;backdrop-filter:blur(6px)}
.auth-in .inp.focus{background:rgba(255,255,255,.18);border-color:#fff}
.auth-in .inp span{color:#fff}
.auth-in .inp .cc{color:rgba(255,255,255,.75);border-right-color:rgba(255,255,255,.24)}
.auth-in .inp .ph{color:rgba(255,235,242,.55)}
.auth-in .btn.pink{background:#fff;color:#8C0538}
.auth-in .btn.google{background:rgba(255,255,255,.94);border-color:transparent;color:#1C1712}
.auth-in .btn.ghost{background:transparent;border-color:rgba(255,255,255,.38);color:#FFFDF5}
.auth-in .or span{color:rgba(255,235,242,.6)}
.auth-in .or i{background:rgba(255,255,255,.2)}
.auth-in .esc{color:rgba(255,235,242,.75)}
.auth-in .esc b{color:#fff;text-decoration:underline;text-underline-offset:3px}
.auth-in .fine{color:rgba(255,235,242,.62)}
.auth-in .fine b{color:#fff}
.auth-in .lk{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.auth-in .lk-strong{color:#fff;font-weight:700}
.auth-in .ok{color:#9BE8B8}
.auth-in .resend b{color:#FFD9E6}
.auth-in .otp i{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff}
.auth-in .otp i.f{background:rgba(255,255,255,.2);border-color:#fff}
.auth-in .resend{color:rgba(255,235,242,.72)}
.auth-in .resend b{color:#fff}
.auth-in .n-warn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:rgba(255,235,242,.85)}
.auth-in .n-warn b{color:#FFD9E6}
.auth-in .claim{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.auth-in .cl-t{color:#fff}
.auth-in .cl-s{color:rgba(255,235,242,.8)}

/* ── CIRCLE CAPSULE ── */
.cap{display:inline-flex;align-items:center;gap:8px;border-radius:20px;padding:7px 15px;font-size:12px;font-weight:700;white-space:nowrap}
.cap.on{background:rgba(31,157,82,.16);border:1px solid rgba(31,157,82,.4);color:#1F9D52}
.cap.on .dot{width:7px;height:7px;border-radius:50%;background:#1F9D52;box-shadow:0 0 0 3px rgba(31,157,82,.18)}
.cap.light{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);color:#fff}
.cap.light .dot{width:7px;height:7px;border-radius:50%;background:#9BE8B8}

/* ── APP UI ── */
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.hd-b{width:34px;height:34px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.hd-t{font-size:16px;font-weight:700;color:var(--dark)}
.hd-x{margin-left:auto;font-size:13px;color:var(--sub-text)}
.body{padding:20px 18px;flex:1;display:flex;flex-direction:column}
.mark{display:flex;justify-content:center;margin-bottom:18px}
.mark img{height:52px;width:auto}
.h1{font-size:23px;font-weight:700;color:var(--dark);line-height:1.28;margin-bottom:8px;letter-spacing:-.3px}
.sub{font-size:14px;color:var(--sub-text);line-height:1.72;margin-bottom:20px}
.fld{margin-bottom:12px}
.lbl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-bottom:6px;display:block}
.inp{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:13px 15px;font-size:15px;background:var(--bg);color:var(--dark);display:flex;align-items:center;gap:9px}
.inp.focus{border-color:var(--pink);background:#fff}
.inp .cc{color:var(--sub-text);font-weight:600;border-right:1px solid var(--border);padding-right:9px}
.inp .ph{color:var(--sub-text)}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-bottom:10px}
.btn.pink{background:var(--pink);color:#fff}
.btn.dark{background:var(--darkbar);color:#fff}
.btn.wa{background:var(--wa);color:#fff;display:flex;align-items:center;justify-content:center;gap:9px}
.btn.ghost{background:none;border:1.5px solid var(--border);color:var(--body-text)}
.btn.google{background:#fff;border:1.5px solid var(--border);color:var(--dark);display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled,.btn.off{background:#E4DCCC;color:#9A8E7A}
.or{display:flex;align-items:center;gap:12px;margin:16px 0}
.or span{font-size:11.5px;color:var(--sub-text)}
.or i{flex:1;height:1px;background:var(--border)}
.esc{text-align:center;font-size:13.5px;color:var(--sub-text);padding:14px 0 2px}
.esc b{color:var(--pink);font-weight:700}
.fine{font-size:11.5px;color:var(--sub-text);line-height:1.7;text-align:center;margin-top:14px}
.fine b{color:var(--mid-text)}
.otp{display:flex;gap:9px;margin-bottom:14px}
.otp i{flex:1;height:52px;border:1.5px solid var(--border);border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;font-style:normal;color:var(--dark)}
.otp i.f{border-color:var(--pink);background:#fff}
.resend{font-size:13px;color:var(--sub-text);text-align:center;margin-bottom:8px}
.resend b{color:var(--pink)}

/* GATE SHEET */
.dim{flex:1;background:rgba(28,23,18,.42);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px 18px}
.sh-h{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px}
.sh-i{width:48px;height:48px;border-radius:14px;background:var(--p-bg);border:1px solid var(--p-bd);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:13px}
.sh-t{font-size:19px;font-weight:700;color:var(--dark);line-height:1.32;margin-bottom:7px}
.sh-s{font-size:14px;color:var(--sub-text);line-height:1.75;margin-bottom:17px}

/* ACCOUNT */
.acct-top{background:var(--darkbar);padding:22px 18px 20px}
.av{width:52px;height:52px;border-radius:15px;background:var(--pink);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.acct-n{font-size:21px;font-weight:700;color:var(--hero-text);line-height:1.25}
.acct-p{font-size:13px;color:var(--dim);margin-top:3px}
.acct-c{display:inline-flex;align-items:center;gap:7px;background:rgba(31,157,82,.18);border:1px solid rgba(31,157,82,.36);border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#7BD69B;margin-top:12px}
.mrow{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border-light)}
.mrow:last-child{border-bottom:none}
.m-i{width:38px;height:38px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.m-n{flex:1;min-width:0}
.m-t{display:block;font-size:15px;font-weight:600;color:var(--dark);line-height:1.3}
.m-s{display:block;font-size:12px;color:var(--sub-text);margin-top:2px}
.m-c{font-size:11px;font-weight:700;background:var(--p-bg);color:var(--p-tx);border:1px solid var(--p-bd);border-radius:6px;padding:3px 9px}
.m-a{font-size:16px;color:var(--sub-text)}
.mgrp{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;padding:16px 18px 7px;background:var(--bg)}
.danger .m-t{color:#8C1130}

/* LISTS */
.li{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border-light)}
.li-th{width:52px;height:52px;border-radius:11px;flex-shrink:0}
.li-n{flex:1;min-width:0}
.li-t{display:block;font-size:14.5px;font-weight:600;color:var(--dark);line-height:1.3}
.li-s{display:block;font-size:12px;color:var(--sub-text);margin-top:3px;line-height:1.5}
.li-b{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:3px 8px;margin-top:6px}
.li-b.on{background:var(--d-bg);color:var(--d-tx);border:1px solid var(--d-bd)}
.li-b.soon{background:var(--p-bg);color:var(--p-tx);border:1px solid var(--p-bd)}
.li-b.done{background:var(--bg);color:var(--sub-text);border:1px solid var(--border)}
.tog{width:42px;height:24px;border-radius:12px;background:var(--wa);position:relative;flex-shrink:0;align-self:center}
.tog::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.tog.off{background:#D8CEBE}
.tog.off::after{right:auto;left:3px}
.empty{padding:44px 24px;text-align:center}
.e-i{font-size:34px;margin-bottom:12px}
.e-t{font-size:17px;font-weight:700;color:var(--dark);margin-bottom:7px}
.e-s{font-size:13.5px;color:var(--sub-text);line-height:1.75;margin-bottom:16px}

/* ORDER */
.ord{border:1px solid var(--border);border-radius:14px;margin:14px 18px;overflow:hidden}
.ord-h{background:var(--bg);padding:11px 15px;display:flex;justify-content:space-between;align-items:baseline}
.ord-id{font-size:12px;font-weight:700;color:var(--dark)}
.ord-d{font-size:11.5px;color:var(--sub-text)}
.ord-b{padding:13px 15px}
.ord-t{font-size:14.5px;font-weight:600;color:var(--dark)}
.ord-s{font-size:12px;color:var(--sub-text);margin-top:3px}
.ord-f{border-top:1px solid var(--border-light);padding:11px 15px;display:flex;justify-content:space-between;align-items:center}
.ord-p{font-size:14px;font-weight:700;color:var(--dark)}
.ord-a{font-size:12.5px;color:var(--pink);font-weight:700}
.stat{display:flex;gap:9px;padding:12px 15px;background:#FCFAF6;border-top:1px solid var(--border-light)}
.st-d{width:9px;height:9px;border-radius:50%;background:var(--wa);margin-top:4px;flex-shrink:0}
.st-t{font-size:12.5px;color:var(--body-text);line-height:1.6}
.st-t b{color:var(--dark)}

/* CLAIM */
.claim{background:var(--data-bg);border:1px solid var(--data-bd);border-radius:14px;padding:16px 17px;margin:14px 18px}
.cl-t{font-size:15px;font-weight:700;color:var(--data-tx);margin-bottom:6px;line-height:1.35}
.cl-s{font-size:13px;color:var(--data-tx);line-height:1.72;margin-bottom:12px;opacity:.85}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;padding:12px}
  .rg{width:100%;padding:6px 8px 2px}
  .ri{border-left:none;border-radius:8px;padding:7px 12px;font-size:12.5px}
  .main{grid-template-columns:1fr;padding:20px 16px 60px;gap:24px}
  .phone{width:100%;max-width:390px;margin:0 auto}
}
</style>
</head>
<body>

<div class="top">
  <span class="top-l">ACCOUNT WORKFLOW</span>
  <span class="top-n">Phone OTP · Google · User ID and password  ·  guest checkout allowed  ·  gates on save, reminders and tracking</span>
</div>

<div class="layout">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <div class="phone"><div class="ph-bar"><span></span></div><div class="ph-body" id="screen"></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

 </div>

/* ══ GATES ══ */
S.gsave={g:'GATES',n:5,t:'Gate — saving a ritual',ey:'GATE',
 note:`<p class="n-p">A bottom sheet over the article, not a redirect. The person keeps their place, and the article is still visible behind it.</p>
 <div class="n-rule"><div class="n-rl">WHY THIS IS GATED</div><p class="n-rt">A saved ritual has to live somewhere. That is a real reason, and the sheet says it plainly rather than asserting that an account is <b>required</b>.</p></div>
 <div class="n-warn"><b>The dismiss is a full-width option, not an ✕ in the corner.</b> At this age profile a small corner ✕ reads as a trap.</div>`,
 ui:`<div class="hd"><span class="hd-b">←</span><span class="hd-t">Sharad Navratri</span><span class="hd-x">Share</span></div>
 <div class="dim"><div class="sheet">
   <div class="sh-h"></div>
   <div class="sh-i">🔖</div>
   <div class="sh-t">Save this guide to read again?</div>
   <p class="sh-s">Saved rituals live in your account, so they are there on any device and before the date comes round again.</p>
   <button class="btn pink">Continue with mobile number</button>
   <button class="btn google">${G} Continue with Google</button>
   <button class="btn ghost">Not now — keep reading</button>
 </div></div>`};

S.gremind={g:'GATES',n:6,t:'Gate — setting a reminder',ey:'GATE',
 note:`<p class="n-p">The strongest gate to cross, because the value is obvious and immediate. It also collects the phone number naturally — the same number the reminder will be sent to.</p>
 <div class="n-box"><div class="n-bh">TWO THINGS TO NOTICE</div>
   <div class="n-r"><span>·</span><span>The date is named. <b>Ghatasthapana, 11 October</b> — not "this festival".</span></div>
   <div class="n-r"><span>·</span><span>Free reminders and the paid Circle are separated here, so nobody feels bait-and-switched later.</span></div>
 </div>`,
 ui:`<div class="hd"><span class="hd-b">←</span><span class="hd-t">Sharad Navratri</span></div>
 <div class="dim"><div class="sheet">
   <div class="sh-h"></div>
   <div class="sh-i">🔔</div>
   <div class="sh-t">Remind you before Ghatasthapana?</div>
   <p class="sh-s">We will message you on 10 October, the evening before, with the muhurat and the guide attached. Free.</p>
   <button class="btn pink">Continue with mobile number</button>
   <button class="btn google">${G} Continue with Google</button>
   <button class="btn ghost">Not now</button>
   <p class="fine">Reminders for a guide you are reading are free. <b>The Tapa Circle</b> at ₹499 a year covers every festival and vrat in the calendar.</p>
 </div></div>`};

S.delete={g:'ACCOUNT',n:13,t:'Delete account — DPDP',ey:'COMPLIANCE',

   <div class="n-r"><span>·</span><span>What is deleted immediately — saved rituals, reminders, addresses, the profile.</span></div>
   <div class="n-r"><span>·</span><span>What is retained and why — invoices, for the statutory period. This is a legal obligation, not a choice.</span></div>
   <div class="n-r"><span>·</span><span>What happens to an active subscription and any order in flight.</span></div>
 </div>
 <div class="n-warn"><b>Type DELETE to confirm.</b> Not a checkbox — this is irreversible and the friction is the point.</div>`,

/* RAIL */
const rail=document.getElementById('rail');
let html='',last='';
Object.entries(S).forEach(([k,v])=>{
  if(v.g!==last){html+=`<div class="rg">${v.g}</div>`;last=v.g;}
  html+=`<a class="ri" data-k="${k}"><span class="ri-n">${v.n}</span><span>${v.t}</span></a>`;
});
rail.innerHTML=html;

function show(k){
  const v=S[k];
  document.querySelectorAll('.ri').forEach(r=>r.classList.toggle('on',r.dataset.k===k));
  document.getElementById('screen').innerHTML=v.ui;
  document.getElementById('notes').innerHTML=`<div class="n-ey">${v.ey} · SCREEN ${v.n}</div><div class="n-t">${v.t}</div>${v.note}`;
}
document.querySelectorAll('.ri').forEach(r=>r.addEventListener('click',()=>show(r.dataset.k)));
show('signin');
