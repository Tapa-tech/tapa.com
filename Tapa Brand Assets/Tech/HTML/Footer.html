<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Footer System — The Tapa Co.</title>
<style>
/* ============================================================
   THE TAPA CO. — FOOTER SYSTEM
   Six bands · Phase 1 and Phase 2 · mobile accordions · spec
   ============================================================ */
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --darkbar:#1A1208;
  --pink:#FD066D; --amber:#E8A020; --gold:#A07800; --yellow:#EDAB3A;
  --body-text:#2C2010; --mid-text:#5C4B12; --sub-text:#8A7A68;
  --border:#E8E0D0; --border-light:#F0E8D8;
  --hero-text:#FFFDF5; --dim:#7A6A55; --dimmer:#5C4E36;
  --b-bg:#F0E9E1; --b-tx:#4A3525; --b-bd:#D9CBB8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--body-text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}

/* PREVIEW */
.pv{background:#2E2260;padding:10px 32px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;position:sticky;top:0;z-index:200}
.pv-l{font-size:9.5px;font-weight:700;color:#B9A9DC;letter-spacing:.7px;margin-right:4px}
.pvb{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:600;color:#D8CEF0}
.pvb.on{background:#fff;color:#2E2260;border-color:#fff}
.pv-n{margin-left:auto;font-size:10.5px;color:#9A8AC0;font-style:italic}
.stage{padding:30px 32px 80px;max-width:1400px;margin:0 auto}
.lbl{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.8px;margin:30px 0 9px}
.lbl:first-child{margin-top:0}
.note{font-size:13px;color:var(--sub-text);line-height:1.75;margin:0 0 14px;max-width:820px}
.frame{border-radius:16px;overflow:hidden;box-shadow:0 2px 18px rgba(28,23,18,.05)}

/* ══════════ FOOTER ══════════ */
.tf{background:var(--dark)}
.tf-w{max-width:1280px;margin:0 auto;padding:0 40px}

/* BAND 1 — brand */
.tf-brand{padding:46px 20px 34px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
.tf-brand::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 75% at 50% 95%,rgba(253,6,109,.07) 0%,transparent 65%)}
.tf-lot{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:15px;position:relative}
.tf-line{height:1px;width:54px;background:rgba(227,181,103,.25)}
.tf-tag{font-size:27px;font-weight:700;color:var(--hero-text);margin-bottom:9px;letter-spacing:-.4px;position:relative}
.tf-tag em{color:var(--pink);font-style:normal}
.tf-sub{font-size:13.5px;color:var(--sub-text);line-height:1.72;max-width:520px;margin:0 auto 20px;position:relative}
.tf-cta{background:var(--pink);border:none;border-radius:22px;padding:12px 27px;font-size:13.5px;font-weight:700;color:#fff;position:relative}

/* BAND 2 — utility */
.tf-util{border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.028)}
.tf-util-in{max-width:1280px;margin:0 auto;padding:18px 40px;display:flex;align-items:center;gap:20px}
.tf-srch{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:12px 18px}
.tf-srch .q{flex:1;font-size:13.5px;color:var(--dim)}
.tf-srch-go{background:var(--pink);border:none;border-radius:16px;padding:7px 15px;font-size:12px;font-weight:700;color:#fff}
.tf-auth{margin-left:auto;display:flex;align-items:center;gap:10px}
.tf-auth-n{font-size:12px;color:var(--dim);margin-right:4px}
.tf-b-g{background:none;border:1.5px solid rgba(255,255,255,.22);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--hero-text);white-space:nowrap}
.tf-b-s{background:var(--pink);border:none;border-radius:20px;padding:11px 22px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}

/* BAND 3 — sitemap */
.tf-map{border-bottom:1px solid rgba(255,255,255,.07);padding:30px 0 32px}
.tf-map-h{font-size:10px;font-weight:700;color:#E3B567;letter-spacing:.7px;margin-bottom:20px}
.tf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.tf-cat-t{font-size:14.5px;font-weight:700;color:var(--hero-text);margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.09)}
.tf-s{font-size:12.5px;color:var(--sub-text);display:block;padding:5px 0}
.tf-s:hover{color:#E3B567}
.tf-s.lead{color:#FF9EBE;font-weight:600}
.tf-all{font-size:12px;color:var(--pink);font-weight:600;display:block;padding-top:8px}
.tf-grid.pre{margin-top:26px;padding-top:24px;border-top:1px dashed rgba(255,255,255,.09)}
.tf-cat.locked .tf-cat-t{color:var(--dim)}
.tf-when{font-size:12px;color:var(--amber);display:block;padding:4px 0;font-weight:600}
.tf-when-s{font-size:11.5px;color:var(--dimmer);display:block;line-height:1.6}
.tf-when-s a{color:var(--pink);font-weight:600}

/* BAND 4 — columns */
.tf-nav{padding:34px 0 36px;border-bottom:1px solid rgba(255,255,255,.07)}
.tf-nav-g{display:grid;grid-template-columns:1.05fr 1fr 1fr 1.15fr;gap:36px}
.tf-cl{font-size:10px;font-weight:700;color:#E3B567;letter-spacing:.7px;margin-bottom:14px}
.tf-l{font-size:13px;color:var(--sub-text);display:block;padding:5.5px 0}
.tf-l:hover{color:#E3B567}
.tf-l .paid{font-size:9px;background:rgba(253,6,109,.18);color:#FF7FA8;padding:2px 7px;border-radius:4px;margin-left:6px;font-weight:700}
.tf-l.locked{color:var(--dimmer)}
.tf-csub{font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin:2px 0 10px}
.tf-csub.second{margin-top:22px}
.tf-reach{display:flex;align-items:center;gap:11px;padding:8px 0}
.tf-ri{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06)}
.tf-ri img{height:22px;width:auto;border-radius:5px;display:block}
.tf-rt{display:block;font-size:13px;color:var(--hero-text);font-weight:500;line-height:1.35}
.tf-rs{display:block;font-size:11px;color:var(--dim);line-height:1.5;margin-top:1px}
.tf-soc{display:flex;gap:9px;margin-top:2px}
.tf-so{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}

/* BAND 5 — legal */
.tf-dev{margin-top:16px;font-size:13px;color:#C4A882;letter-spacing:.4px;position:relative}
.tf-corr{padding:22px 0 24px;border-bottom:1px solid rgba(255,255,255,.07)}
.tf-corr-t{font-size:14.5px;font-weight:700;color:var(--hero-text);margin-bottom:7px}
.tf-corr-p{font-size:12.5px;color:var(--dim);line-height:1.75;max-width:760px;margin-bottom:10px}
.tf-corr-a{font-size:12.5px;font-weight:700;color:var(--pink)}
.tf-legal{padding:24px 0 30px}
.tf-pol{display:flex;flex-wrap:wrap;gap:9px 20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:16px}
.tf-pol span{font-size:12px;color:var(--dim)}
.tf-gb{font-size:9.5px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin-bottom:7px}
.tf-gt{font-size:12px;color:var(--sub-text);line-height:1.85}
.tf-gt b{color:var(--hero-text);font-weight:600}
.tf-ent{font-size:11.5px;color:var(--dimmer);line-height:1.8;margin-top:12px}
.tf-copy{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tf-mark{display:flex;align-items:center;gap:10px}
.tf-mark img{height:32px;width:auto;opacity:.85}
.tf-cl-l{font-size:12px;color:var(--sub-text)}
.tf-cl-l b{color:var(--hero-text);font-weight:600}
.tf-made{font-size:11.5px;color:var(--dimmer)}

/* MOBILE FOOTER */
.mf{max-width:390px;margin:0 auto;border-radius:20px;overflow:hidden;background:var(--dark)}
.mf .tf-w{padding:0 18px}
.mf-acc{border-bottom:1px solid rgba(255,255,255,.07)}
.mf-a{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;color:var(--hero-text);border-bottom:1px solid rgba(255,255,255,.07)}
.mf-a .car{font-size:11px;color:var(--dim)}
.mf-sub{background:rgba(255,255,255,.03);padding:4px 18px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.mf-s{display:block;padding:10px 0;font-size:13.5px;color:var(--sub-text);border-bottom:.5px solid rgba(255,255,255,.05)}
.mf-s:last-child{border-bottom:none}
.mf-s.lead{color:#FF9EBE;font-weight:700}


.mf-one{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;font-size:15.5px;font-weight:700;color:var(--hero-text);border-bottom:1px solid rgba(255,255,255,.07)}
.mf-one small{display:block;font-size:11.5px;font-weight:500;color:var(--dim);margin-top:2px}
.mf-panel{background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.07);padding:4px 18px 16px}
.mf-gh{font-size:9.5px;font-weight:700;color:#E3B567;letter-spacing:.6px;margin:14px 0 6px}
.mf-gh:first-child{margin-top:8px}
.mf-row{display:flex;flex-wrap:wrap;gap:7px}
.mf-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 12px;font-size:12.5px;color:var(--sub-text)}
.mf-chip.lead{background:rgba(253,6,109,.14);border-color:rgba(255,158,190,.3);color:#FF9EBE;font-weight:700}
.mf-chip.soon{color:var(--dimmer);border-style:dashed}
.mf-chip .m{color:var(--amber);font-weight:700;margin-left:5px}

/* SPEC */
.spec{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.spec-r{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:13px 20px;border-bottom:.5px solid var(--border-light);font-size:13.5px}
.spec-r:last-child{border-bottom:none}
.spec-k{font-weight:700;color:var(--dark)}
.spec-v{color:var(--body-text);line-height:1.7}

@media (max-width:900px){
  .stage{padding:20px 14px 60px}
  .pv{padding:10px 14px}.pv-n{display:none}
  .tf-util-in{padding:16px 18px;flex-direction:column;gap:12px;align-items:stretch}
  .tf-srch{max-width:none}
  .tf-auth{margin-left:0}.tf-auth-n{display:none}
  .tf-b-g,.tf-b-s{flex:1;text-align:center}
  .tf-grid,.tf-grid.pre,.tf-nav-g{grid-template-columns:1fr;gap:22px}
  .tf-copy{flex-direction:column;align-items:flex-start;gap:10px}
  .spec-r{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body>

<div class="pv">
  <span class="pv-l">FOOTER SYSTEM</span>
  <button class="pvb on" onclick="show('p1')">Phase 1</button>
  <button class="pvb" onclick="show('p2')">Phase 2</button>
  <button class="pvb" onclick="show('mobile')">Mobile — long</button>
  <button class="pvb" onclick="show('mobile2')">Mobile — compact</button>
  <button class="pvb" onclick="show('spec')">Spec</button>
  <span class="pv-n">Six bands · sitemap above columns</span>
</div>

<div class="stage" id="stage"></div>
